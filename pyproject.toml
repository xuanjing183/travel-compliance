[project]
name = "travel-compliance-desk"
version = "0.1.0"
description = "Travel compliance and approval desk demo (FDE portfolio)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite>=0.22,<0.23",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<1",
    "jieba>=0.42,<0.43",
    "langchain-openai>=1.4,<1.5",
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pydantic>=2.13,<3",
    "pypdf>=6,<7",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<0.1",
    "sse-starlette>=3.3.4,<3.4",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
travel-desk = "travel_desk.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Policy quotes must match the documents verbatim; tests keep expected values on one line.
"src/travel_desk/db/seed.py" = ["E501"]
"tests/*" = ["E501"]
